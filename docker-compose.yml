version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: auth_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_system
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "18891:3306"
    networks:
      - app_network

  backend:
    build: ./backend
    container_name: auth_backend
    restart: always
    ports:
      - "8891:80"
    volumes:
      - ./backend/src:/var/www/html
      # Preserve composer dependencies installed inside the image
      # (otherwise the bind mount above hides /var/www/html/vendor)
      - /var/www/html/vendor
    environment:
      # 设为 1 可开启模拟发信（不连接 SMTP，适合联调/演示）
      MAIL_MOCK: "${MAIL_MOCK:-0}"
      MAIL_HOST: "${MAIL_HOST:-smtp.163.com}"
      MAIL_PORT: "${MAIL_PORT:-465}"
      MAIL_SECURE: "${MAIL_SECURE:-ssl}"
      MAIL_USERNAME: "${MAIL_USERNAME:-yuwangifeng@163.com}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-LRZMA358wePVGa8F}"
    depends_on:
      - db
    networks:
      - app_network

  frontend:
    build: ./frontend
    container_name: auth_frontend
    restart: always
    ports:
      - "3891:80"
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
